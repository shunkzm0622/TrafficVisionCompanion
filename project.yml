name: TrafficVisionCompanion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  TrafficVisionPhone:
    type: application
    platform: iOS
    sources:
      - path: iPhone
      - path: Shared
    dependencies:
      - target: TrafficVisionWatchCompanion
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trafficvisioncompanion
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TrafficVision
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TrafficVisionWatchCompanion:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trafficvisioncompanion.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TrafficVision
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.trafficvisioncompanion
        TARGETED_DEVICE_FAMILY: '4'
