
name: Build TrafficVision Companion Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project without cross-platform embedding
        shell: bash
        run: |
          set -euo pipefail

          # Remove the original Watch dependency.
          # Build the two platforms separately.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project.yml")
          s = p.read_text()

          s, n = re.subn(
              r'(?m)^    dependencies:\n'
              r'      - target: TrafficVisionWatchCompanion\n'
              r'        embed: true\n',
              '',
              s,
              count=1
          )

          if n != 1:
              raise SystemExit(
                  "Expected Watch dependency not found in project.yml"
              )

          p.write_text(s)
          PY

          xcodegen generate --spec project.yml

      - name: Build Apple Watch for physical device
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project TrafficVisionCompanion.xcodeproj \
            -scheme TrafficVisionWatchCompanion \
            -configuration Release \
            -sdk watchos \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$RUNNER_TEMP/TVWatchBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/watch-build.log"

      - name: Build iPhone for physical device
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project TrafficVisionCompanion.xcodeproj \
            -scheme TrafficVisionPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TVPhoneBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/iphone-build.log"

      - name: Embed Watch app and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PHONE="$RUNNER_TEMP/TVPhoneBuild/Build/Products/Release-iphoneos/TrafficVisionPhone.app"
          WATCH="$RUNNER_TEMP/TVWatchBuild/Build/Products/Release-watchos/TrafficVisionWatchCompanion.app"

          test -d "$PHONE" || {
            echo '::error::iPhone app not found'
            exit 1
          }

          test -d "$WATCH" || {
            echo '::error::Watch app not found'
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/TVPayload/Payload"
          mkdir -p "$RUNNER_TEMP/TVOutput"

          APP="$RUNNER_TEMP/TVPayload/Payload/TrafficVisionPhone.app"

          ditto "$PHONE" "$APP"

          mkdir -p "$APP/Watch"

          ditto "$WATCH" \
            "$APP/Watch/TrafficVisionWatchCompanion.app"

          # Verify embedded Watch application.
          test -f \
            "$APP/Watch/TrafficVisionWatchCompanion.app/Info.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Watch/TrafficVisionWatchCompanion.app/Info.plist"

          echo "Watch app embedded successfully"

          find "$APP/Watch" \
            -maxdepth 2 -name '*.app' -type d -print

          echo "Watch companion bundle ID:"

          /usr/libexec/PlistBuddy \
            -c 'Print :WKCompanionAppBundleIdentifier' \
            "$APP/Watch/TrafficVisionWatchCompanion.app/Info.plist"

          cd "$RUNNER_TEMP/TVPayload"

          zip -q -r \
            "$RUNNER_TEMP/TVOutput/TrafficVisionCompanion-UNSIGNED.ipa" \
            Payload

          unzip -l \
            "$RUNNER_TEMP/TVOutput/TrafficVisionCompanion-UNSIGNED.ipa" \
            | grep 'Payload/TrafficVisionPhone.app/Watch/TrafficVisionWatchCompanion.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrafficVisionCompanion-UNSIGNED-with-Watch
          path: ${{ runner.temp }}/TVOutput/TrafficVisionCompanion-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-logs
          path: |
            ${{ runner.temp }}/watch-build.log
            ${{ runner.temp }}/iphone-build.log
          if-no-files-found: ignore
